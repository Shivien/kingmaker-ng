<mat-toolbar color="primary" class="app-toolbar">
  <div class="brand">
    <a class="title" routerLink="/">
      <mat-icon>home</mat-icon>
      <span>Kingmaker</span>
    </a>
  </div>
  <div class="spacer"></div>
  <div class="user-section">
    @if (authStore.isAuthenticated()) {
      <button matButton [matMenuTriggerFor]="userMenu">
        <div class="user">
          <div class="user__picture">
            <img
              referrerpolicy="no-referrer"
              [src]="authStore.userPicture()"
              alt="Avatar"
              />
          </div>
          <div class="user__name">
            {{ authStore.userName() }}
          </div>
        </div>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profil (WIP)</span>
        </button>
        <button mat-menu-item routerLink="/admin/user/list">
          <mat-icon>groups</mat-icon>
          <span>Utilisateurs</span>
        </button>
        <button mat-menu-item (click)="authService.logout()">
          <mat-icon>close</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    }
    @else {
      <asl-google-signin-button type="standard" size="medium" theme="filled_black"></asl-google-signin-button>
    }
  </div>
</mat-toolbar>

<p>SIDEBAR</p>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
