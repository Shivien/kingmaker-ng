<div class="container">

  <div class="main">
    <mat-list>
      @for (group of sortedGroups(); track $index) {
        <mat-list-item>
          <div class="group" [class.selected]="group.id === room()?.currentGroupId">
            <div class="label">{{ group.label }}</div>
            <div class="initiative">{{ group.initiative }}</div>
          </div>
        </mat-list-item>
      }
    </mat-list>
  </div>

  <div class="footer">
    <div class="button-bar">
      <button matButton type="button" [disabled]="sending()" (click)="onPrevious()">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button matButton type="button" [disabled]="sending()" (click)="onNext()">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

</div>
