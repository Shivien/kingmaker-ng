<div class="layout">
  <div class="header">
    <div class="online" [class.online-off]="!connected()">
      @if (connected()) {
        <mat-icon>wifi</mat-icon>
      } @else {
        <mat-icon>wifi_off</mat-icon>
      }
    </div>

    <div class="title uppercase">
      {{ pageTitle() }}
    </div>
  </div>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
