<div class="container">
  <mat-card class="stack">
    <mat-card-header>
      <mat-card-title>
        <div class="flex cross--center main--space-between gap--3">
          <span>Liste des sorts de {{ character()?.name }}</span>
          <a matIconButton [routerLink]="`/ose/character/${id()}/spell/new`">
            <mat-icon>add</mat-icon>
          </a>
        </div>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <div class="spinner-container">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else {
        <mat-list>
          @for (item of sortedSpells(); track $index) {
            <mat-list-item class="list-item link" [routerLink]="`/ose/character/${id()}/spell/${item._id}`">
              <div class="flex cross--center main--space-between">
                <div>
                  <span>{{ item.level }}</span>
                  -
                  <span>{{ item.name }}</span>
                </div>
                <div>
                  @if (item.prepared > 0) {
                    <span class="quantity">&times;{{ item.prepared }}</span>
                  }
                </div>
              </div>
            </mat-list-item>
          }
        </mat-list>
      }
    </mat-card-content>
  </mat-card>
</div>
