<div class="container stack">
  <h2 class="title--2">Liste des personnages</h2>

  @if (loading()) {
    <div class="spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }
  @else {
    <div class="stack">

      <div>
        <a matButton routerLink="/ose/character/new">
          <mat-icon>add</mat-icon>
          <span>Créer un nouveau personnage</span>
        </a>
      </div>

      <table mat-table [dataSource]="items()">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Nom </th>
          <td mat-cell *matCellDef="let item">
            {{ item.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let item">
            <button
              mat-icon-button
              matTooltip="Modifier le personnage"
              routerLink="/ose/character/{{ item._id }}/edit"
              >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              matTooltip="Préparation des sorts"
              routerLink="/ose/character/{{ item._id }}/spell"
              >
              <mat-icon>star_shine</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

    </div>
  }

</div>
